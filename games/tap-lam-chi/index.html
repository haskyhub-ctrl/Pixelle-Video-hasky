<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tập Làm Chị</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap&subset=vietnamese">
<style>
/* Layout: one-screen playroom. Chunky outlined "toy block" tiles on a mint nursery wall; every game fits the viewport, big tap targets for a 4-year-old. */
:root{
  --wall:#CDEFE4; --wall-dot:#B6E3D5; --ink:#1E3A4C; --ink-soft:#4F6B7A; --paper:#FFFFFF; --paper-soft:#F4FBF8;
  --coral:#FF7A66; --sun:#FFC845; --lilac:#B9A6F5; --sky:#8ED0F4; --pink:#FFB5C8; --mint:#93E0C3; --good:#22A86E; --oops:#E8604E;
  --display:'Baloo 2','Nunito',ui-rounded,system-ui,sans-serif;
  --body:'Nunito',ui-rounded,system-ui,sans-serif;
  --r:22px; --edge:3px solid var(--ink); --lift:0 6px 0 var(--ink);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--wall);color:var(--ink);font-family:var(--body);font-size:18px;overflow:hidden;
  background-image:radial-gradient(var(--wall-dot) 2.5px,transparent 3px);background-size:34px 34px}
#app{height:100%;overflow-y:auto;padding-inline:16px;padding-block:12px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-width:1100px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--coral);outline-offset:3px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}
.ico{display:inline-grid;place-items:center}
.ico svg{width:1em;height:1em}
.block{background:var(--paper);border:var(--edge);border-radius:var(--r);box-shadow:var(--lift)}
.press{transition:transform .08s, box-shadow .08s}
.press:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}

/* Home */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{flex:1 1 280px;min-width:0;display:flex;align-items:center;gap:12px}
.brand .badge{font-size:46px;width:72px;height:72px;display:grid;place-items:center;background:var(--sun);border:var(--edge);border-radius:50%;box-shadow:var(--lift);flex:none}
.brand h1{font-size:clamp(30px,6vw,52px);font-weight:800;letter-spacing:.5px}
.brand p{margin:2px 0 0;color:var(--ink-soft);font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border:var(--edge);border-radius:999px;background:var(--paper);font-weight:800;box-shadow:0 4px 0 var(--ink)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.act{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px 10px 12px;text-align:center;min-height:150px;background:var(--tint,var(--paper))}
.act .big{font-size:clamp(48px,9vw,68px)}
.act{padding-top:8px}
.act h3{font-size:clamp(18px,2.6vw,23px);font-weight:800}
.stars{font-size:20px;letter-spacing:2px;color:var(--ink)}
.stars .off{opacity:.22}
.board{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.board h2{font-size:22px}
.stickers{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
@media (max-width:600px){.stickers{grid-template-columns:repeat(4,minmax(0,1fr))}}
.stk{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:clamp(26px,5vw,40px);border-radius:50%;border:3px dashed var(--ink-soft);background:var(--paper-soft)}
.stk.on{border-style:solid;border-color:var(--ink);background:var(--sun);animation:pop .5s}
.stk:not(.on) .ico{filter:grayscale(1);opacity:.25}

/* Play screen */
.bar{display:flex;align-items:center;gap:10px}
.round{width:60px;height:60px;border-radius:50%;border:var(--edge);background:var(--paper);font-size:28px;display:grid;place-items:center;box-shadow:0 5px 0 var(--ink);flex:none}
.dots{flex:1;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.dots i.done{background:var(--good)} .dots i.now{background:var(--sun)}
.bubble{position:relative;padding:14px 18px;font-size:clamp(19px,3vw,26px);font-weight:800;line-height:1.3;min-height:1.3em;display:flex;gap:12px;align-items:center}
.bubble .who{font-size:38px;flex:none}
.bubble p{margin:0;min-width:0}
.stage{position:relative;flex:1;min-height:340px;display:flex;flex-direction:column;gap:14px}

/* Sequence */
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{width:64px;height:64px;border-radius:16px;border:3px dashed var(--ink-soft);display:grid;place-items:center;font-size:36px;background:rgba(255,255,255,.5);position:relative}
.slot b{font-family:var(--display);font-size:22px;color:var(--ink-soft)}
.slot.fill{border-style:solid;border-color:var(--ink);background:var(--paper);animation:pop .4s}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;align-content:start}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;font-weight:800;font-size:clamp(17px,2.4vw,21px);line-height:1.2;text-align:center}
.card .big{font-size:clamp(58px,9vw,76px)}
.shake{animation:shake .45s}
.hint{animation:glow 1s infinite}
.used{visibility:hidden}

/* Overlay mini-games */
.over{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--paper-soft);border:var(--edge);border-radius:var(--r);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.rubzone{width:clamp(150px,30vw,220px);animation:bob 2s ease-in-out infinite}
.count{font-family:var(--display);font-size:64px;font-weight:800;line-height:1}
.meter{width:min(420px,80%);height:24px;border:var(--edge);border-radius:999px;background:var(--paper);overflow:hidden}
.meter span{display:block;height:100%;width:0;background:var(--sky);transition:width .2s}
.fx{position:absolute;pointer-events:none;font-size:34px;animation:rise 1.1s ease-out forwards}
.table{position:relative;width:min(560px,92%);aspect-ratio:16/9;max-width:100%;background:var(--sun);border:var(--edge);border-radius:28px;box-shadow:var(--lift)}
.spot{position:absolute;width:16%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 40%,#9B6B43,#6E4526);transform:translate(-50%,-50%);transition:opacity .15s}
.hand-tip{font-weight:800;color:var(--ink-soft)}

/* Sort */
.sortcard{align-self:center;width:min(420px,100%);display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;text-align:center;font-weight:800;font-size:clamp(20px,3vw,26px);line-height:1.25}
.sortcard .big{font-size:clamp(90px,16vw,120px)}
.sortcard.in{animation:pop .35s}
.sortcard.flyL{animation:flyL .5s forwards}.sortcard.flyR{animation:flyR .5s forwards}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.bin{display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px;font-weight:800;font-size:clamp(17px,2.6vw,22px);line-height:1.2;text-align:center}
.bin .big{font-size:clamp(52px,9vw,68px)}
.bin.L{background:var(--mint)} .bin.R{background:var(--pink)}

/* Quiz */
.scene{display:flex;align-items:center;justify-content:center;gap:18px;padding:12px;flex-wrap:wrap}
.scene .who{width:clamp(130px,26vw,200px);font-size:clamp(90px,16vw,130px);animation:bob 2.4s ease-in-out infinite}
.scene .cue{font-size:clamp(46px,8vw,64px);background:var(--paper);border:var(--edge);border-radius:50%;width:1.6em;height:1.6em;display:grid;place-items:center;box-shadow:0 4px 0 var(--ink)}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.opts.six{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:520px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opt{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;font-weight:800;font-size:clamp(16px,2.4vw,20px);line-height:1.2;text-align:center}
.opt .big{font-size:clamp(56px,10vw,74px)}
.opt.no{opacity:.35;pointer-events:none}
.opt.yes{background:var(--mint)}
.hearts{display:flex;justify-content:center;gap:6px;font-size:30px}
.hearts .off{filter:grayscale(1);opacity:.25}

/* Crib */
.crib{position:relative;align-self:center;width:min(560px,94%);aspect-ratio:16/10;max-width:100%;border:var(--edge);border-radius:20px;background:
  repeating-linear-gradient(90deg,transparent 0 30px,var(--ink) 30px 36px),var(--paper);box-shadow:var(--lift)}
.crib::after{content:"";position:absolute;left:6%;right:6%;bottom:8%;height:34%;background:var(--sky);border:var(--edge);border-radius:14px}
.crib .it{position:absolute;z-index:2;transform:translate(-50%,-50%);font-size:clamp(56px,10vw,84px);background:none;border:0;padding:6px;transition:transform .5s,opacity .5s}
.crib .it.gone{transform:translate(-50%,-260%) scale(.4);opacity:0;pointer-events:none}
.crib .sleeper{position:absolute;z-index:2;left:50%;bottom:12%;width:30%;transform:translateX(-50%);animation:pop .5s}
.zz{position:absolute;z-index:2;left:62%;bottom:44%;font-family:var(--display);font-weight:800;font-size:30px;animation:rise 2s infinite}

/* Intro & done */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.hero{width:min(460px,86vw);animation:bob 2.6s ease-in-out infinite}
.center .bubble{max-width:640px}
.center h2{font-size:clamp(34px,6vw,54px);font-weight:800}
.go{padding:16px 40px;font-family:var(--display);font-size:30px;font-weight:800;background:var(--coral);color:var(--paper)}
.go.alt{background:var(--paper);color:var(--ink)}
.row{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.bigstars{font-size:56px;letter-spacing:6px}
.bigstars .off{opacity:.2}
.medal{font-size:90px;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:var(--sun);border:var(--edge);box-shadow:var(--lift);animation:pop .6s}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:12px;height:18px;border-radius:3px;animation:fall 2.6s linear forwards}

/* Parents */
.parent{background:var(--paper);border:var(--edge);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:18px;font-size:17px;line-height:1.55}
.parent section{max-width:70ch}
.parent h2{font-size:28px}.parent h3{font-size:21px;margin-bottom:6px}
.parent ul{margin:6px 0;padding-left:22px}.parent li{margin:4px 0}
.parent a{color:var(--ink);font-weight:800}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:800}
.form select{font:inherit;padding:10px 12px;border:var(--edge);border-radius:12px;background:var(--paper-soft);color:var(--ink)}
.form input[type=text]{font:inherit;padding:10px 12px;border:var(--edge);border-radius:12px;background:var(--paper-soft);color:var(--ink)}
.tog{flex-direction:row!important;align-items:center;gap:10px!important}
.tog input{width:26px;height:26px;accent-color:var(--good)}
.small{padding:10px 18px;font-weight:800;border:var(--edge);border-radius:999px;background:var(--paper);box-shadow:0 4px 0 var(--ink)}
.small.warn{background:var(--pink)}
.note{color:var(--ink-soft);font-size:15px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;min-width:520px;width:100%}
.tbl th,.tbl td{border-bottom:2px solid var(--wall);padding:8px;text-align:left;vertical-align:top}
.tbl th{font-family:var(--display);font-size:18px}

.art{display:block;width:100%;max-width:280px}
.art svg,.hero svg,.who svg,.buddy svg,.face svg{display:block;width:100%;height:auto}
.face{display:block;border-radius:50%;overflow:hidden;background:var(--paper-soft);border:var(--edge)}
.bubble .face{width:58px;height:58px;flex:none}
.brand .badge.face{background:var(--sun);padding:0}
.duo{display:flex;align-items:center;justify-content:center;gap:10px}
.duo>.sortcard,.duo>.slots{min-width:0;flex:1 1 auto}
.buddy{width:clamp(78px,16vw,120px);flex:none}
.buddy.jump{animation:jump .55s}
.winrow{display:flex;align-items:flex-end;justify-content:center;gap:12px}
.winrow .buddy{width:clamp(130px,28vw,190px)}
/* Animation: characters blink, wave, breathe; props float and twinkle; mom's mouth moves while she talks */
svg .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
svg .wave{transform-box:view-box;transform-origin:128px 158px;animation:wave 1.6s ease-in-out infinite}
svg .fl{transform-box:fill-box;transform-origin:center;animation:floaty 2.4s ease-in-out infinite}
svg .d2{animation-delay:-.8s} svg .d3{animation-delay:-1.6s}
svg .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 1.8s ease-in-out infinite}
svg .pl{transform-box:fill-box;transform-origin:center;animation:pulse 1.4s ease-in-out infinite}
svg .zzs{animation:zzz 2.4s ease-in-out infinite}
svg .wg{transform-box:fill-box;transform-origin:center;animation:wiggle 1.6s ease-in-out infinite}
svg .breathe{transform-box:fill-box;transform-origin:center bottom;animation:breathe 3s ease-in-out infinite}
svg .shake-it{animation:shakeit .25s linear infinite}
svg .sway{transform-box:fill-box;transform-origin:center bottom;animation:sway 2.6s ease-in-out infinite}
svg .m-talk{display:none}
.talking svg .m-still{display:none}
.talking svg .m-talk{display:inline;transform-box:fill-box;transform-origin:center;animation:talk .22s ease-in-out infinite alternate}
.talking .face{animation:nod .9s ease-in-out infinite}
.buddy svg{transform-origin:center bottom;animation:breathe 3.2s ease-in-out infinite}
.scene .who svg{animation:none}
.cards>*,.opts>*,.bins>*,.grid>*{animation:enter .45s cubic-bezier(.3,1.4,.6,1) both}
.cards>:nth-child(2),.opts>:nth-child(2),.bins>:nth-child(2),.grid>:nth-child(2){animation-delay:.07s}
.cards>:nth-child(3),.opts>:nth-child(3),.grid>:nth-child(3){animation-delay:.14s}
.cards>:nth-child(4),.opts>:nth-child(4),.grid>:nth-child(4){animation-delay:.21s}
.cards>:nth-child(5),.opts>:nth-child(5),.grid>:nth-child(5){animation-delay:.28s}
.cards>:nth-child(6),.opts>:nth-child(6),.grid>:nth-child(6){animation-delay:.35s}
.cards>:nth-child(7),.grid>:nth-child(7){animation-delay:.42s}
.grid>:nth-child(8){animation-delay:.49s}
.card.go-slot{animation:toslot .45s ease-in forwards}
.opt.yes .ico{animation:jump .55s}
.stars .ico,.bigstars .ico,.chip .ico{width:1em;height:1em}
.stars .st,.bigstars .st{display:inline-block}
.bigstars .st:not(.off){animation:pop .5s both}.bigstars .st:nth-child(2){animation-delay:.2s}.bigstars .st:nth-child(3){animation-delay:.4s}
.round .ico{width:34px;height:34px}.round .ico svg{width:100%;height:100%}
.hearts .hrt.off{filter:grayscale(1);opacity:.3}
.hearts .hrt:not(.off){animation:pop .4s}
.cards>.shake,.bins>.shake,.opts>.shake{animation:shake .45s}
.cards>.hint,.opts>.hint,.bins>.hint{animation:glow 1s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0);opacity:1}50%{transform:scale(.6) rotate(45deg);opacity:.6}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes zzz{0%,100%{transform:translateY(0);opacity:1}50%{transform:translateY(-6px);opacity:.5}}
@keyframes wiggle{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03,1.02)}}
@keyframes shakeit{0%,100%{transform:translateX(-3px)}50%{transform:translateX(3px)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.1)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes enter{from{transform:translateY(24px) scale(.85);opacity:0}to{transform:none;opacity:1}}
@keyframes toslot{40%{transform:scale(1.08)}100%{transform:translateY(-120px) scale(.2);opacity:0}}
@keyframes jump{40%{transform:translateY(-18px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes glow{50%{box-shadow:0 6px 0 var(--ink),0 0 0 8px var(--sun)}}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes rise{from{transform:translate(-50%,-50%);opacity:1}to{transform:translate(-50%,-160%);opacity:0}}
@keyframes flyL{to{transform:translate(-40%,120%) scale(.3);opacity:0}}
@keyframes flyR{to{transform:translate(40%,120%) scale(.3);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app" aria-live="polite"></div>

<script>
/* ---------- Icons that emoji lack ---------- */
const SVG = {
  diaper:'<svg viewBox="0 0 64 64"><path d="M6 16h52l-4 13c-3 10-10 19-22 21C20 48 13 39 10 29z" fill="#fff" stroke="#5AAEE3" stroke-width="4" stroke-linejoin="round"/><rect x="3" y="12" width="13" height="9" rx="3" fill="#FFC845" stroke="#1E3A4C" stroke-width="2"/><rect x="48" y="12" width="13" height="9" rx="3" fill="#FFC845" stroke="#1E3A4C" stroke-width="2"/><path d="M22 30q10 6 20 0" fill="none" stroke="#B9A6F5" stroke-width="3" stroke-linecap="round"/></svg>',
  diaperOpen:'<svg viewBox="0 0 64 64"><path d="M8 8h48v20c0 14-10 28-24 28S8 42 8 28z" fill="#fff" stroke="#5AAEE3" stroke-width="4" stroke-linejoin="round"/><circle cx="26" cy="34" r="4" fill="#B4874F"/><circle cx="36" cy="40" r="3" fill="#B4874F"/><circle cx="34" cy="28" r="2.5" fill="#B4874F"/></svg>',
  mat:'<svg viewBox="0 0 64 64"><rect x="4" y="18" width="56" height="30" rx="8" fill="#93E0C3" stroke="#1E3A4C" stroke-width="3"/><circle cx="18" cy="33" r="4" fill="#fff"/><circle cx="32" cy="33" r="4" fill="#fff"/><circle cx="46" cy="33" r="4" fill="#fff"/></svg>',
  pillow:'<svg viewBox="0 0 64 64"><path d="M8 18q24-10 48 0q6 14 0 28q-24 10-48 0q-6-14 0-28z" fill="#fff" stroke="#1E3A4C" stroke-width="3"/><path d="M20 32h24" stroke="#B9A6F5" stroke-width="3" stroke-linecap="round"/></svg>',
  blanket:'<svg viewBox="0 0 64 64"><rect x="6" y="10" width="52" height="44" rx="6" fill="#FFB5C8" stroke="#1E3A4C" stroke-width="3"/><path d="M6 24h52M6 38h52M22 10v44M40 10v44" stroke="#fff" stroke-width="4"/></svg>',
  towel:'<svg viewBox="0 0 64 64"><rect x="10" y="6" width="44" height="6" rx="3" fill="#1E3A4C"/><rect x="14" y="12" width="36" height="46" rx="4" fill="#8ED0F4" stroke="#1E3A4C" stroke-width="3"/><path d="M14 46h36" stroke="#fff" stroke-width="5"/></svg>',
  wipes:'<svg viewBox="0 0 64 64"><rect x="6" y="20" width="52" height="32" rx="10" fill="#fff" stroke="#1E3A4C" stroke-width="3"/><rect x="20" y="16" width="24" height="12" rx="5" fill="#93E0C3" stroke="#1E3A4C" stroke-width="3"/><path d="M26 18q6-10 12 0" fill="#fff" stroke="#1E3A4C" stroke-width="2"/></svg>'
};

/* ---------- Characters: chị (big sister), mẹ (mom), em bé (baby). Hand-drawn SVG, one style. ---------- */
const C = {skin:'#FFDCC4', shade:'#F4BFA0', hair:'#4A2E2A', hair2:'#6B4238', ink:'#2B2230', cheek:'#FF8FA3', mouth:'#C9404F', tongue:'#FF8E9B',
  coral:'#FF7A66', coralD:'#E45C4B', lilac:'#B9A6F5', lilacD:'#9A85E6', mint:'#93E0C3', mintD:'#6CCBA8', sun:'#FFC845', sunD:'#F2A81D', blue:'#7CC3F0', white:'#FFFFFF'};
const svg = (inner, vb) => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
const place = (inner, x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">${inner}</g>`;

function eyes(xs, y, t, r=1){ return `<g class="eyes${['joy','closed','squeeze','half'].includes(t)?'':' blink'}">`+eyes0(xs,y,t,r)+'</g>'; }
function eyes0(xs, y, t, r=1){
  const st = `fill="none" stroke="${C.ink}" stroke-width="${4*r}" stroke-linecap="round" stroke-linejoin="round"`;
  return xs.map((x,i)=>{
    switch(t){
      case 'joy': return `<path d="M${x-8*r} ${y+3*r} Q${x} ${y-8*r} ${x+8*r} ${y+3*r}" ${st}/>`;
      case 'closed': return `<path d="M${x-8*r} ${y-1*r} Q${x} ${y+7*r} ${x+8*r} ${y-1*r}" ${st}/>`;
      case 'squeeze': return i===0 ? `<path d="M${x-7*r} ${y-6*r} L${x+5*r} ${y} L${x-7*r} ${y+6*r}" ${st}/>` : `<path d="M${x+7*r} ${y-6*r} L${x-5*r} ${y} L${x+7*r} ${y+6*r}" ${st}/>`;
      case 'half': return `<path d="M${x-8*r} ${y} Q${x} ${y+6*r} ${x+8*r} ${y}" ${st}/><path d="M${x-9*r} ${y-3*r} L${x+9*r} ${y-3*r}" ${st} stroke-width="${3*r}" opacity=".55"/>`;
      case 'up': return `<ellipse cx="${x}" cy="${y}" rx="${6.5*r}" ry="${8.5*r}" fill="${C.ink}"/><circle cx="${x+1.5*r}" cy="${y-5*r}" r="${2.6*r}" fill="#fff"/>`;

    }
  }).join('');
}
function mouth(x, y, t, r=1){
  const st = `fill="none" stroke="${C.ink}" stroke-width="${3.5*r}" stroke-linecap="round"`;
  switch(t){
    case 'grin': return `<path d="M${x-12*r} ${y-2*r} Q${x} ${y+18*r} ${x+12*r} ${y-2*r} Z" fill="${C.mouth}"/><path d="M${x-6*r} ${y+7*r} Q${x} ${y+3*r} ${x+6*r} ${y+7*r} Q${x} ${y+12*r} ${x-6*r} ${y+7*r}Z" fill="${C.tongue}"/>`;
    case 'o': return `<ellipse cx="${x}" cy="${y+3*r}" rx="${5*r}" ry="${6*r}" fill="${C.mouth}"/>`;
    case 'small': return `<ellipse cx="${x}" cy="${y+2*r}" rx="${3*r}" ry="${2.5*r}" fill="${C.mouth}"/>`;
    case 'wail': return `<ellipse cx="${x}" cy="${y+5*r}" rx="${11*r}" ry="${12*r}" fill="${C.mouth}"/><ellipse cx="${x}" cy="${y+12*r}" rx="${6*r}" ry="${4*r}" fill="${C.tongue}"/>`;
    case 'yawn': return `<ellipse cx="${x}" cy="${y+5*r}" rx="${8*r}" ry="${11*r}" fill="${C.mouth}"/>`;
    case 'flat': return `<path d="M${x-6*r} ${y+3*r} L${x+6*r} ${y+3*r}" ${st}/>`;
    case 'sad': return `<path d="M${x-8*r} ${y+7*r} Q${x} ${y-1*r} ${x+8*r} ${y+7*r}" ${st}/>`;
    default: return `<path d="M${x-10*r} ${y} Q${x} ${y+11*r} ${x+10*r} ${y}" ${st}/>`;

}

function ic(k){
  if(k.startsWith('svg:')) return `<span class="ico">${SVG[k.slice(4)]}</span>`;
  const v = ICON[k];
  if(!v) return `<span class="ico"></span>`;
  if(typeof v==='object') return `<span class="ico">${svg(v.ch(), v.vb)}</span>`;
  return `<span class="ico">${svg(v,'0 0 64 64')}</span>`;
}

/* ---------- Saved state ---------- */
const DEF = {chi:'chị', em:'em bé', voice:true, rate:.75, voiceName:'', stars:{}, seen:false};
let S = Object.assign({}, DEF);
try{ Object.assign(S, JSON.parse(localStorage.getItem('tapLamChi')||'{}')); }catch(e){}
function save(){ try{ localStorage.setItem('tapLamChi', JSON.stringify(S)); }catch(e){} }
const T = s => s.replace(/\{chi\}/g, (S.chi||'chị').trim()).replace(/\{em\}/g, (S.em||'em bé').trim());
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

/* ---------- Voice + sounds ---------- */
let viVoice=null, viVoices=[], lastSay='', sayToken=0;
const MALE=/\b(an|nam ?minh|minh|male|nam)\b/i, FEMALE=/hoai ?my|hoài my|linh|female|nữ|google|thu|mai|lan/i;
function pickVoice(){ try{
  viVoices = speechSynthesis.getVoices().filter(v=>/^vi/i.test(v.lang));
  viVoice = (S.voiceName && viVoices.find(v=>v.name===S.voiceName))
    || viVoices.find(v=>FEMALE.test(v.name) && !MALE.test(v.name))
    || viVoices.find(v=>!MALE.test(v.name)) || viVoices[0] || null;
}catch(e){} }
try{ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }catch(e){}
function say(text, onEnd){
  text = cap(T(text)); lastSay = text;
  const b = document.querySelector('#bubble p'); if(b) b.textContent = text;
  const my = ++sayToken; let fired=false;
  const fin = ()=>{ if(fired||my!==sayToken) return; fired=true; onEnd&&onEnd(); };
  const rate = S.rate||.75;
  const est = Math.max(1600, text.length*62/rate+600);
  const bub = document.getElementById('bubble');
  if(bub){ bub.classList.add('talking'); clearTimeout(say.t); say.t=setTimeout(()=>bub.classList.remove('talking'), est); }
  const stopTalk = ()=>{ if(my===sayToken){ clearTimeout(say.t); document.getElementById('bubble')?.classList.remove('talking'); } };
  if(S.voice && window.speechSynthesis){
    try{
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang='vi-VN'; if(viVoice) u.voice=viVoice; u.rate=rate; u.pitch=1.12;
      u.onend=()=>{ stopTalk(); setTimeout(fin,250); }; u.onerror=()=>setTimeout(fin,est);
      speechSynthesis.speak(u);
      setTimeout(fin, est+4000); // safety net if onend never fires
      return;
    }catch(e){}
  }
  setTimeout(fin, est);
}
function hush(){ sayToken++; try{ speechSynthesis.cancel(); }catch(e){} }
let ac=null;
function tone(seq){
  try{
    ac = ac || new (window.AudioContext||window.webkitAudioContext)();
    let t = ac.currentTime;
    seq.forEach(([f,d])=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.02); t+=d*.8; });
  }catch(e){}
}

  <div class="grid">${ACTS.map((a,i)=>`
    <button class="act block press" data-i="${i}" style="--tint:${a.tint}">
      <span class="art">${scene(a.id)}</span><h3>${a.title}</h3>${starsHtml(S.stars[a.id]||0)}
    </button>`).join('')}</div>
  <div class="board block"><h2>Bảng huy hiệu của ${esc(T('{chi}'))}</h2>
    <div class="stickers">${ACTS.map(a=>`<div class="stk ${S.stars[a.id]?'on':''}" title="${a.title}">${ic(a.sticker)}</div>`).join('')}</div>
  </div>`;
  app.querySelectorAll('.act').forEach(b=>b.onclick=()=>intro(ACTS[+b.dataset.i]));
  document.getElementById('toParent').onclick=parent;
  if(speak) say(got===ACTS.length ? 'Wow! {chi} có đủ tất cả huy hiệu rồi. {chi} đã sẵn sàng làm chị!' : 'Chào {chi}! Chọn một trò chơi nha.');
}

function shell(act){
  app.innerHTML = `
  <div class="bar">
    <button class="round press" id="goHome" aria-label="Về màn hình chính">${ic('🏠')}</button>
    <div class="dots">${act.stages.map(()=>'<i></i>').join('')}</div>
    <button class="round press" id="again" aria-label="Nghe lại">${ic('🔊')}</button>
  </div>
  <div class="bubble block"><span class="who face">${faceMom()}</span><p></p></div>
  <div class="stage" id="stage"></div>`;
  document.getElementById('goHome').onclick=()=>home(true);
  document.getElementById('again').onclick=()=>say(lastSay);
}

function intro(act){
  hush();
  run = {act, idx:0, miss:0};
  app.innerHTML = `
  <div class="bar"><button class="round press" id="goHome" aria-label="Về màn hình chính">${ic('🏠')}</button><div class="dots"></div>
  <button class="round press" id="again" aria-label="Nghe lại">${ic('🔊')}</button></div>
  <div class="center">
    <div class="hero">${scene(act.id)}</div>
    <h2>${act.title}</h2>
    <div class="bubble block" id="bubble"><span class="who face">${faceMom()}</span><p></p></div>
    <button class="go block press" id="start">Bắt đầu</button>
  </div>`;
  document.getElementById('goHome').onclick=()=>home(true);
  document.getElementById('again').onclick=()=>say(lastSay);
  document.getElementById('start').onclick=()=>{ shell(act); stage(); };
  say(act.intro);
}

function stage(){
  const {act, idx} = run;
  app.querySelectorAll('.dots i').forEach((d,i)=>d.className = i<idx?'done':(i===idx?'now':''));
  app.querySelector('.bubble').id='bubble';
  const st = act.stages[idx], el = document.getElementById('stage');
  el.innerHTML='';
  const me = run;
  const next = ()=>{ if(run!==me) return; run.idx++; run.idx < act.stages.length ? stage() : finish(); };
  ({seq:seqStage, sort:sortStage, quiz:quizStage, clear:clearStage, wipe:wipeStage})[st.type](st, el, next);
}

function finish(){
  const {act, miss} = run;
  const n = miss<=1 ? 3 : miss<=4 ? 2 : 1;
  const first = !S.stars[act.id];
  S.stars[act.id] = Math.max(S.stars[act.id]||0, n); save();
  sfx.win(); confetti();
  app.innerHTML = `
  <div class="center">
    <div class="winrow"><div class="buddy jump">${buddy('good')}</div><div class="medal">${ic(act.sticker)}</div></div>
    <h2>Giỏi quá!</h2>
    ${starsHtml(n,'bigstars')}
    <div class="bubble block" id="bubble"><span class="who face">${faceMom()}</span><p></p></div>
    <div class="row"><button class="go block press" id="more">Chơi trò khác</button><button class="go alt block press" id="redo">Chơi lại</button></div>
  </div>`;
  document.getElementById('more').onclick=()=>home(true);
  document.getElementById('redo').onclick=()=>intro(act);
  say((first?'{chi} nhận được huy hiệu mới! ':'')+'Giỏi lắm! Mẹ tự hào về {chi}!');
}

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=document.createElement('div'); box.className='confetti';
  const cols=['var(--coral)','var(--sun)','var(--lilac)','var(--sky)','var(--mint)','var(--pink)'];
  for(let i=0;i<60;i++){ const c=document.createElement('i'); c.style.left=Math.random()*100+'%'; c.style.background=cols[i%cols.length]; c.style.animationDelay=(Math.random()*.8)+'s'; c.style.animationDuration=(2+Math.random()*1.5)+'s'; box.appendChild(c); }
  document.body.appendChild(box); setTimeout(()=>box.remove(),4200);
}

/* ---------- Game engines ---------- */
function react(el, mood){
  el.querySelectorAll('.buddy').forEach(b=>{ b.innerHTML=buddy(mood); b.classList.remove('jump'); void b.offsetWidth; if(mood==='good') b.classList.add('jump'); });
  clearTimeout(react.t); react.t=setTimeout(()=>el.querySelectorAll('.buddy').forEach(b=>b.innerHTML=buddy()),1800);
}
function seqStage(st, el, done){
  const steps = st.steps.map((s,i)=>({...s, k:s.k||('s'+i)}));
  let cur=0, wrong=0, busy=false;
  el.innerHTML = `<div class="duo"><div class="buddy">${buddy()}</div><div class="slots">${steps.map((s,i)=>`<div class="slot"><b>${i+1}</b></div>`).join('')}</div></div>
    <div class="cards">${shuffle(steps).map(s=>`<button class="card block press" data-k="${s.k}"><span class="big">${ic(s.i)}</span>${s.t}</button>`).join('')}</div>`;
  const slots = el.querySelectorAll('.slot');
  say(st.prompt);
  el.querySelectorAll('.card').forEach(c=>c.onclick=()=>{
    if(busy || c.classList.contains('go-slot')) return;
    const step = steps[cur];
    if(c.dataset.k === step.k){
      sfx.good(); wrong=0; react(el,'good');
      el.querySelectorAll('.hint').forEach(h=>h.classList.remove('hint'));
      c.classList.add('go-slot'); setTimeout(()=>c.classList.add('used'),450);
      slots[cur].innerHTML = ic(step.i); slots[cur].classList.add('fill');
      cur++;
      const after = ()=>{ busy=false; if(cur===steps.length){ busy=true; setTimeout(done,500); } };
      busy=true;
      if(step.rub) say(step.say, ()=>rubGame(el, after));
      else say(step.say, after);
    } else {
      sfx.oops(); run.miss++; wrong++; react(el,'oops');
      c.classList.remove('shake'); void c.offsetWidth; c.classList.add('shake');
      say(wrong>=2 ? 'Bước tiếp theo là: '+step.t+'. Tìm thẻ đang sáng nha!' : 'Chưa phải bước này. Thử thẻ khác nha!');
      if(wrong>=2) el.querySelector(`.card[data-k="${step.k}"]:not(.used):not(.go-slot)`)?.classList.add('hint');
    }
  });
}

function rubGame(el, cb){
  const o=document.createElement('div'); o.className='over';
  o.innerHTML=`<div class="rubzone">${svg(girl({e:'joy',m:'grin',pose:'front',prop:'bubbles'}),'0 0 200 260')}</div><div class="count">0</div><div class="meter"><span></span></div><div class="hand-tip">Xoa ngón tay qua lại trên màn hình. Đếm đến hai mươi!</div>`;
  el.appendChild(o);
  say('Chà lòng bàn tay, mu bàn tay, kẽ ngón tay và đầu ngón tay. Xoa màn hình và đếm đến hai mươi nha!');
  let n=0, dist=0, last=null, lastTick=0, fin=false;
  const cnt=o.querySelector('.count'), bar=o.querySelector('.meter span');
  const move=e=>{
    if(fin) return;
    if(e.pointerType==='mouse' && !e.buttons){ last=null; return; }
    const r=o.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
    if(last) dist+=Math.hypot(x-last.x,y-last.y);
    last={x,y};
    if(Math.random()<.18){ const b=document.createElement('span'); b.className='fx'; b.innerHTML=ic('🫧'); b.style.left=x+'px'; b.style.top=y+'px'; o.appendChild(b); setTimeout(()=>b.remove(),1100); }
    const now=performance.now();
    if(dist>120 && now-lastTick>550){
      dist=0; lastTick=now; n++; cnt.textContent=n; bar.style.width=(n*5)+'%';
      if(n<20){ say(NUM[n]); }
      else { fin=true; sfx.good(); say('Hai mươi! Tay sạch bong rồi!', ()=>{ o.remove(); cb(); }); }
    }
  };
  o.addEventListener('pointerdown',e=>{ last=null; try{o.setPointerCapture(e.pointerId);}catch(_){} move(e); });
  o.addEventListener('pointermove',move);
  o.addEventListener('pointerup',()=>last=null);
}

function wipeStage(st, el, done){
  el.innerHTML=`<div class="over" style="position:relative;flex:1"><div class="table" id="tbl"></div><div class="hand-tip">Chà ngón tay lên vết bẩn</div></div>`;
  const tbl=el.querySelector('#tbl'), zone=el.querySelector('.over');
  const spots=[[18,30],[48,24],[78,34],[30,70],[62,68],[86,74]].map(([x,y])=>{
    const s=document.createElement('div'); s.className='spot'; s.style.left=x+'%'; s.style.top=y+'%'; s._d=1; tbl.appendChild(s); return s; });
  say(st.prompt);
  let fin=false;
  const move=e=>{
    if(fin || (e.pointerType==='mouse' && !e.buttons)) return;
    spots.forEach(s=>{ if(s._d<=0) return; const r=s.getBoundingClientRect();
      if(Math.hypot(e.clientX-(r.left+r.width/2), e.clientY-(r.top+r.height/2)) < r.width*.75){
        s._d-=.06; s.style.opacity=Math.max(0,s._d);
        if(s._d<=0){ sfx.tick(); const f=document.createElement('span'); f.className='fx'; f.innerHTML=ic('✨'); f.style.left=s.style.left; f.style.top=s.style.top; tbl.appendChild(f); setTimeout(()=>f.remove(),1100); }
      }});
    if(spots.every(s=>s._d<=0)){ fin=true; sfx.good(); say(st.done, ()=>setTimeout(done,300)); }
  };
  zone.addEventListener('pointerdown',e=>{ try{zone.setPointerCapture(e.pointerId);}catch(_){} move(e); });
  zone.addEventListener('pointermove',move);
}

function sortStage(st, el, done){
  const items = shuffle(st.items); let k=0, need=null, busy=false;
  el.innerHTML=`<div class="duo"><div class="buddy">${buddy()}</div><div class="sortcard block" id="sc"></div></div>
    <div class="bins"><button class="bin L block press" data-a="L"><span class="big">${ic(st.left.i)}</span>${st.left.t}</button>
    <button class="bin R block press" data-a="R"><span class="big">${ic(st.right.i)}</span>${st.right.t}</button></div>`;
  const sc=el.querySelector('#sc'), bins=el.querySelectorAll('.bin');
  const showItem=(lead)=>{
    const it=items[k]; need=null; busy=false;
    sc.className='sortcard block in'; sc.innerHTML=`<span class="big">${ic(it.i)}</span>${T(it.t)}`;
    say((lead?lead+' ':'')+it.t);
  };
  bins.forEach(b=>b.onclick=()=>{
    if(busy) return;
    const it=items[k], ok=b.dataset.a===it.a;
    if(ok){
      busy=true; sfx.good(); react(el,'good'); bins.forEach(x=>x.classList.remove('hint'));
      sc.classList.add(it.a==='L'?'flyL':'flyR');
      const go=()=>{ k++; k<items.length ? showItem() : done(); };
      need ? say('Đúng rồi!', go) : say('Đúng rồi! '+it.why, go);
    } else if(!need){
      sfx.oops(); run.miss++; need=it.a; react(el,'oops');
      b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
      el.querySelector(`.bin[data-a="${it.a}"]`).classList.add('hint');
      say('Ồ, chưa đúng. '+it.why+' Chạm vào ô đang sáng nha.');
    }
  });
  showItem(st.prompt);
}

function quizStage(st, el, done){
  const rounds = st.n ? shuffle(st.rounds).slice(0,st.n) : st.rounds;
  let r=0;
  const play=()=>{
    const R=rounds[r]; let opts, ans, wrong=0, busy=false;
    if(R.opts){ opts=shuffle(R.opts.map((o,j)=>({...o,k:'o'+j}))); ans='o0'; } else { opts=st.opts; ans=R.ans; }
    el.innerHTML=`${st.hearts?`<div class="hearts">${rounds.map((_,i)=>`<span class="hrt ${i<r?'':'off'}">${ic('❤️')}</span>`).join('')}</div>`:''}
      <div class="scene">${R.who.includes(':')?`<span class="who">${charSvg(R.who)}</span>`:`<span class="who">${ic(R.who)}</span>`}<span class="cue">${ic(R.cue)}</span><span class="buddy">${buddy()}</span></div>
      <div class="opts">${opts.map(o=>`<button class="opt block press" data-k="${o.k}"><span class="big">${ic(o.i)}</span>${T(o.t)}</button>`).join('')}</div>`;
    say(R.q);
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(busy) return;
      if(b.dataset.k===ans){
        busy=true; sfx.good(); react(el,'good'); b.classList.remove('hint'); b.classList.add('yes');
        const h=el.querySelectorAll('.hearts .hrt')[r]; if(h) h.classList.remove('off');
        say(R.why, ()=>{ r++; r<rounds.length ? play() : done(); });
      } else {
        sfx.oops(); run.miss++; wrong++; react(el,'oops'); b.classList.add('no');
        say(wrong>=2 ? 'Gần đúng rồi! Thử ô đang sáng nha.' : 'Chưa đúng. Thử lại nha!');
        if(wrong>=2) el.querySelector(`.opt[data-k="${ans}"]`).classList.add('hint');
      }
    });
  };
  play();
}

function clearStage(st, el, done){
  el.innerHTML=`<div class="crib" id="crib">${st.items.map((it,i)=>`<button class="it" data-i="${i}" style="left:${it.x}%;top:${it.y}%" aria-label="Lấy ra">${ic(it.i)}</button>`).join('')}</div>`;
  say(st.prompt);
  let left=st.items.length;
  el.querySelectorAll('.it').forEach(b=>b.onclick=()=>{
    if(b.classList.contains('gone')) return;
    b.classList.add('gone'); sfx.good(); left--;
    const it=st.items[+b.dataset.i];
    if(left>0) say(it.say);
    else say(it.say, ()=>{
      const crib=el.querySelector('#crib');
      crib.insertAdjacentHTML('beforeend',`<span class="sleeper">${svg(baby('sleep'),'0 0 160 160')}</span>`);
      sfx.win(); say(st.done, ()=>setTimeout(done,400));
    });
  });
}

        <li>Trò chơi không thay thế người lớn giám sát. Các nội dung y khoa ở đây ở mức phổ thông; hỏi bác sĩ nhi khi cần.</li>
